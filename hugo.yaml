baseURL: "https://beatrice-iii.github.io/catbox.github.io/"
title: "我的猫盒博客"
languageCode: zh-cn
theme: stack

# 必须启用 JSON 输出，否则搜索功能将处于死锁状态
outputs:
    home: [HTML, RSS, JSON]

# 侧边栏与核心参数配置
params:
    mainSections: [post]
    featuredImageField: image
    
    sidebar:
        emoji: 🐱
        subtitle: "逻辑海中的观测站"
        avatar:
            enabled: true
            local: false  # <--- 关键：必须显式设置为 false
            src: "https://github.com/Beatrice-III.png"

    # 文章页脚的版权声明
    article:
        license:
            enabled: true
            default: "Licensed under CC BY-NC-SA 4.0"

    # 评论系统（预留位置，建议后续使用 Giscus）
    comments:
        enabled: false


# 禁用多语言（消除重复导航条的根源）
languages:
    zh-cn:
        languageName: Chinese
        title: "我的猫盒博客"
        weight: 1